name: Build Android APK - App 0003

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # 1. Chuẩn bị tài nguyên Web (HTML, CSS, DATA.JS, MAIN.JS) & Tạo cấu hình capacitor.config.json
      - name: Prepare Web Assets & Config
        run: |
          npm init -y
          mkdir -p www
          cp index.html style.css data.js main.js www/ 2>/dev/null || true
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.trithucso.sentencedragpuzzle_0003_x9z",
            "appName": "Sentence Drag & Drop Puzzle Cartoon Pro",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      # 2. Cài đặt các thư viện Capacitor, AdMob & Text-To-Speech Plugin
      - name: Install Capacitor & Plugins
        run: |
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android @capacitor-community/admob @capacitor-community/text-to-speech

      # 3. Đồng bộ dự án Capacitor Android & Đẩy tệp Web vào thư mục Assets Native
      - name: Add & Sync Capacitor Android Project
        run: |
          npx cap add android || true
          npx cap sync android
          mkdir -p android/app/src/main/assets/public
          cp -r www/* android/app/src/main/assets/public/

      # 4. Tự động cắt và chuyển đổi icon.png ở thư mục gốc thành bộ Icon App Android (Mipmap)
      - name: Generate Android App Icons from icon.png
        run: |
          python3 -m pip install Pillow --break-system-packages || python3 -m pip install Pillow || true
          python3 -c "
          import os
          from PIL import Image

          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192
          }

          icon_path = 'icon.png'
          if os.path.exists(icon_path):
              img = Image.open(icon_path).convert('RGBA')
              res_dir = 'android/app/src/main/res'
              for folder, size in sizes.items():
                  out_dir = os.path.join(res_dir, folder)
                  os.makedirs(out_dir, exist_ok=True)
                  resized = img.resize((size, size), Image.Resampling.LANCZOS)
                  resized.save(os.path.join(out_dir, 'ic_launcher.png'), 'PNG')
                  resized.save(os.path.join(out_dir, 'ic_launcher_round.png'), 'PNG')
                  resized.save(os.path.join(out_dir, 'ic_launcher_foreground.png'), 'PNG')
              print('✅ Đã cập nhật icon.png thành công vào tất cả mipmap resolution!')
          else:
              print('⚠️ Không tìm thấy file icon.png!')
          "

      # 5. Khắc phục lỗi xung đột trùng lặp thư viện Kotlin
      - name: Fix Kotlin Duplicate Dependencies
        run: |
          if ! grep -q "kotlin-stdlib-jdk7" android/app/build.gradle; then
            echo "
            configurations.all {
                exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
            }
            " >> android/app/build.gradle
          fi

      # 6. Cấu hình AdMob App ID & Bỏ qua rào cản SSL Mạng (Cleartext Traffic)
      - name: Configure AdMob Network Security & Manifest
        run: |
          mkdir -p android/app/src/main/res/xml
          cat << 'EOF' > android/app/src/main/res/xml/network_security_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system" />
                      <certificates src="user" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          EOF

          python3 -c "
          import os
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r') as f:
                  content = f.read()
              admob_meta = '<meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"ca-app-pub-3940256099942544~3347511713\"/>'
              if 'APPLICATION_ID' not in content:
                  content = content.replace('</application>', f'    {admob_meta}\n    </application>')
              if 'networkSecurityConfig' not in content:
                  content = content.replace('<application ', '<application android:networkSecurityConfig=\"@xml/network_security_config\" android:usesCleartextTraffic=\"true\" ')
              with open(manifest_path, 'w') as f:
                  f.write(content)
          " || true

      # 7. Cấp quyền thực thi và biên dịch file APK Debug
      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 8. Upload file APK kết quả lên GitHub Artifacts
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-0003-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
